{% extends "base.html" %}
{% block head %}

<link
    rel="stylesheet"
    href="/static/css/dashboard.css?v=10"
>

<link
    rel="stylesheet"
    href="/static/css/dashboard_topbar.css?v=3"
>

<link
    rel="stylesheet"
    href="/static/css/dashboard_sidebar.css?v=3"
>



{% endblock %}
{% block body %}

<div class="dashboard-layout">

    <!-- Sidebar -->
    {% include "partials/sidebar.html" %}

    <!-- Main Area -->
    <main class="dashboard-main">

        <!-- ==========================================================
            MOBILE SIDEBAR BUTTON — PART 4
        ========================================================== -->

        <button
            type="button"
            class="mobile-sidebar-toggle"
            id="mobileSidebarToggle"
            aria-label="Open navigation"
            aria-controls="dashboardSidebar"
            aria-expanded="false">

            <i class="bi bi-list"></i>

        </button>


        <div
            class="sidebar-overlay"
            id="sidebarOverlay">
        </div>

        <!-- Topbar -->
        {% include "partials/topbar.html" %}

        <!-- Dashboard Content -->
        <section class="dashboard-content">
            {% include "partials/dashboard-overview.html" %}
        </section>

    </main>

</div>

{% endblock %}

{% block scripts %}

<script
    src="/static/js/dashboard_topbar.js?v=3"
></script>

<script
    src="/static/js/dashboard_sidebar.js?v=3"
></script>

<!-- ==========================================================
     DASHBOARD OVERVIEW
=========================================================== -->

<script
    src="/static/js/dashboard.js?v=1"
></script>

{% endblock %}
