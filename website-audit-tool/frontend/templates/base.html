<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         META
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563EB"
    >


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <title>
        {{ page_title or "AI Website Audit Tool" }}
    </title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        >

        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        >

        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        >

    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         AOS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@2.3.4/dist/aos.css"
    >


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link
        href="/static/css/style.css?v=1"
        rel="stylesheet"
    >


    <!-- =====================================================
         GLOBAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/static/css/base.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/index.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/register.css"
    >
    

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="/static/images/logos/logo.svg"
    >


    <!-- =====================================================
         PAGE SPECIFIC CSS
    ====================================================== -->

    {% block head %}
    {% endblock %}

</head>


<body class="app-shell">


    <!-- =====================================================
         PAGE CONTENT
    ====================================================== -->

    {% block body %}
    {% endblock %}



    <!-- =====================================================
         BOOTSTRAP JAVASCRIPT
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         GLOBAL APPLICATION JS
    ====================================================== -->

    <script
        src="/static/js/app.js?v=21"
    ></script>

    <!-- =====================================================
         GLOBAL / OTHER PAGE SCRIPTS
    ====================================================== -->

    <script
        src="/static/js/hero.js"
    ></script>

    <script
        src="/static/js/profile.js"
    ></script>

    <script
        src="/static/js/report.js"
    ></script>


    <!-- =====================================================
         PAGE-SPECIFIC SCRIPTS
         
         Existing child templates can still add scripts.
    ====================================================== -->

    {% block scripts %}
    {% endblock %}


</body>

</html>
